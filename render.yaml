services:
  # Backend API Service
  - type: web
    name: shoe-store-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        value: ${MONGODB_URI}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: WHATSAPP_PHONE_NUMBER
        value: ${WHATSAPP_PHONE_NUMBER}
      - key: FRONTEND_URL
        value: ${FRONTEND_URL}
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Service
  - type: web
    name: shoe-store-frontend
    runtime: static
    plan: free
    rootDir: frontend-react
    buildCommand: "npm install && npm run build"
    publishDir: build
    envVars:
      - key: REACT_APP_API_URL
        value: ${REACT_APP_API_URL}
    autoDeploy: true
